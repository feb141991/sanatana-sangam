steps:
  # 1. Build the multi-stage Next.js Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/shoonaya:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/shoonaya:latest'
      - '.'

  # 2. Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/shoonaya:$COMMIT_SHA'

  # 3. Deploy container image to Cloud Run service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'shoonaya'
      - '--image'
      - 'gcr.io/$PROJECT_ID/shoonaya:$COMMIT_SHA'
      - '--region'
      - 'asia-south2'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

# Explicit logging configuration required for user-managed service accounts
options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/shoonaya:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/shoonaya:latest'
