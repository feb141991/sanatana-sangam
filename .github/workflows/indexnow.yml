name: IndexNow

on:
  deployment_status:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      submit_all:
        description: Submit every canonical sitemap URL
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest

    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || 'main' }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore previous sitemap snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .indexnow
          artifact_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=indexnow-sitemap-snapshot&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/indexnow-snapshot.zip
            unzip -oq /tmp/indexnow-snapshot.zip -d .indexnow
            echo "Restored sitemap snapshot artifact ${artifact_id}."
          else
            echo "No prior sitemap snapshot was found; this run will submit the full sitemap."
          fi

      - name: Test IndexNow URL selection
        run: node --test scripts/submit-indexnow.test.mjs

      - name: Submit changed canonical URLs
        env:
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha || github.sha }}
          INDEXNOW_FORCE_SUBMIT: ${{ inputs.submit_all || 'false' }}
        run: node scripts/submit-indexnow.mjs

      - name: Save sitemap snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          path: .indexnow/sitemap.json
          name: indexnow-sitemap-snapshot
          include-hidden-files: true
          retention-days: 30
