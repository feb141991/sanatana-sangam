<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shoonaya Open Graph Preview Card</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #FAF6EF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      background: #FAF6EF;
      display: flex;
      align-items: center;
      padding: 50px 70px;
      overflow: hidden;
    }
    /* Ambient sacred warm glow */
    .glow-left {
      position: absolute;
      left: 100px;
      top: 50%;
      transform: translateY(-50%);
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(230, 195, 135, 0.45) 0%, rgba(245, 230, 205, 0.20) 45%, rgba(250, 246, 239, 0) 70%);
      pointer-events: none;
      filter: blur(20px);
    }
    .glow-right {
      position: absolute;
      right: -100px;
      bottom: -100px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(225, 185, 120, 0.20) 0%, rgba(250, 246, 239, 0) 70%);
      pointer-events: none;
      filter: blur(30px);
    }

    /* Luxury border frame */
    .frame-outer {
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(197, 160, 89, 0.45);
      border-radius: 16px;
      pointer-events: none;
    }
    .frame-inner {
      position: absolute;
      inset: 28px;
      border: 1px solid rgba(197, 160, 89, 0.22);
      border-radius: 12px;
      pointer-events: none;
    }
    .corner-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #C5A059;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(197, 160, 89, 0.8);
    }
    .tl { top: 22px; left: 22px; transform: translate(-50%, -50%); }
    .tr { top: 22px; right: 22px; transform: translate(50%, -50%); }
    .bl { bottom: 22px; left: 22px; transform: translate(-50%, 50%); }
    .br { bottom: 22px; right: 22px; transform: translate(50%, 50%); }

    /* Left emblem container */
    .emblem-col {
      flex: 0 0 380px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2;
    }
    .emblem-img {
      width: 330px;
      height: 330px;
      object-fit: contain;
      filter: drop-shadow(0 20px 30px rgba(70, 45, 20, 0.20)) drop-shadow(0 4px 10px rgba(197, 160, 89, 0.35));
    }

    /* Subtle divider */
    .divider-col {
      flex: 0 0 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 380px;
      position: relative;
      z-index: 2;
    }
    .divider-line {
      width: 1px;
      height: 100%;
      background: linear-gradient(to bottom, rgba(197, 160, 89, 0.05), rgba(197, 160, 89, 0.45) 30%, rgba(197, 160, 89, 0.45) 70%, rgba(197, 160, 89, 0.05));
    }
    .divider-gem {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 9px;
      height: 9px;
      background: #C5A059;
      transform: translate(-50%, -50%) rotate(45deg);
      box-shadow: 0 0 10px rgba(197, 160, 89, 0.9);
    }

    /* Right text content */
    .content-col {
      flex: 1;
      padding-left: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #9F6314;
      margin-bottom: 8px;
    }
    .eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #D88A1C;
    }

    .brand-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 68px;
      font-weight: 700;
      color: #2E1B10;
      letter-spacing: 0.04em;
      line-height: 1.05;
      margin-bottom: 6px;
    }

    .tagline {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 26px;
      font-style: italic;
      color: #7A5126;
      font-weight: 400;
      letter-spacing: 0.02em;
      margin-bottom: 20px;
    }

    .feature-strip {
      font-size: 16px;
      font-weight: 500;
      color: #5A4332;
      letter-spacing: 0.02em;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bullet {
      color: #C5A059;
      font-size: 13px;
    }

    /* 4 Traditions Bar */
    .traditions-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 26px;
    }
    .trad-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 253, 248, 0.92);
      border: 1px solid rgba(197, 160, 89, 0.40);
      border-radius: 9999px;
      padding: 7px 16px 7px 12px;
      box-shadow: 0 2px 8px rgba(70, 45, 20, 0.05);
    }
    .trad-symbol {
      font-size: 20px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .trad-symbol.hindu {
      font-family: "Devanagari Sangam MN", "Noto Sans Devanagari", sans-serif;
      color: #D88A1C;
      font-weight: 600;
      font-size: 24px;
    }
    .trad-symbol.sikh {
      font-family: "Gurmukhi Sangam MN", "Noto Sans Gurmukhi", sans-serif;
      color: #1B5E8B;
      font-weight: 600;
      font-size: 22px;
    }
    .trad-symbol.buddhist {
      font-family: "Apple Symbols", sans-serif;
      color: #8B2D3E;
      font-size: 22px;
    }
    .trad-symbol.jain {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .trad-name {
      font-size: 14px;
      font-weight: 700;
      color: #3E2A1F;
      letter-spacing: 0.03em;
    }

    /* Footer Platforms row */
    .footer-row {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .platform-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #2E1B10;
      color: #FAF6EF;
      padding: 8px 18px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      box-shadow: 0 4px 14px rgba(46, 27, 16, 0.25);
    }
    .platform-pill svg {
      width: 15px;
      height: 15px;
      fill: #FAF6EF;
    }
    .web-url {
      font-size: 14px;
      font-weight: 600;
      color: #9F6314;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .web-url span {
      color: rgba(62, 42, 31, 0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="glow-left"></div>
    <div class="glow-right"></div>

    <!-- Double Border Frame -->
    <div class="frame-outer"></div>
    <div class="frame-inner"></div>
    <div class="corner-dot tl"></div>
    <div class="corner-dot tr"></div>
    <div class="corner-dot bl"></div>
    <div class="corner-dot br"></div>

    <!-- Left Emblem Column -->
    <div class="emblem-col">
      <img class="emblem-img" src="../public/brand/shoonaya-emblem-transparent.png" alt="Shoonaya Portal Mark" />
    </div>

    <!-- Vertical Divider -->
    <div class="divider-col">
      <div class="divider-line"></div>
      <div class="divider-gem"></div>
    </div>

    <!-- Right Content Column -->
    <div class="content-col">
      <div class="eyebrow">
        <span class="eyebrow-dot"></span>
        <span>Your Sacred Dharmic Companion</span>
      </div>

      <h1 class="brand-title">SHOONAYA</h1>

      <p class="tagline">Ancient wisdom. In your pocket.</p>

      <div class="feature-strip">
        <span>Daily Panchang</span>
        <span class="bullet">✦</span>
        <span>Festivals</span>
        <span class="bullet">✦</span>
        <span>Scripture</span>
        <span class="bullet">✦</span>
        <span>Japa Mala</span>
        <span class="bullet">✦</span>
        <span>Dharma Mitra AI</span>
      </div>

      <!-- 4 Traditions Badges -->
      <div class="traditions-bar">
        <div class="trad-pill">
          <span class="trad-symbol hindu">ॐ</span>
          <span class="trad-name">Hindu</span>
        </div>
        <div class="trad-pill">
          <span class="trad-symbol sikh">☬</span>
          <span class="trad-name">Sikh</span>
        </div>
        <div class="trad-pill">
          <span class="trad-symbol buddhist">☸</span>
          <span class="trad-name">Buddhist</span>
        </div>
        <div class="trad-pill">
          <span class="trad-symbol jain">
            <svg width="20" height="22" viewBox="0 0 36 40" fill="none">
              <path d="M18 38C10 38 5 31 5 24V13C5 11.3 6.3 10 8 10C9.7 10 11 11.3 11 13V19 C11 17.3 12.3 16 14 16C15.7 16 17 17.3 17 19V18C17 16.3 18.3 15 20 15 C21.7 15 23 16.3 23 18V19C23 17.3 24.3 16 26 16C27.7 16 29 17.3 29 19V26 C29 33 24.3 38 18 38Z" stroke="#2A6B4A" stroke-width="2.2" stroke-linejoin="round"/>
              <circle cx="18" cy="28" r="5" stroke="#2A6B4A" stroke-width="1.8"/>
              <circle cx="18" cy="28" r="2" fill="#2A6B4A"/>
            </svg>
          </span>
          <span class="trad-name">Jain</span>
        </div>
      </div>

      <!-- Footer Platform Strip -->
      <div class="footer-row">
        <div class="platform-pill">
          <!-- Apple icon -->
          <svg viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.99.6-2.63 1.35-.58.67-.99 1.74-.88 2.76 1.01.08 2.03-.51 2.58-1.26z"/></svg>
          <!-- Play Store icon -->
          <svg viewBox="0 0 24 24"><path d="M3.6 2.2c-.3.3-.4.8-.4 1.4v16.8c0 .6.1 1.1.4 1.4l.1.1 9.4-9.4v-.2L3.7 2.1l-.1.1zM16.8 15.6l-3.7-3.7v-.2l3.7-3.7.1.1 4.4 2.5c1.3.7 1.3 1.9 0 2.6l-4.5 2.4zm-3.7-3.8l-9.5 9.5c.4.4 1.1.4 2 .0l11.1-6.3-3.6-3.2zm0-.2l3.6-3.2L5.6 2.1c-.8-.5-1.6-.4-2 0l9.5 9.5z"/></svg>
          <span>Available on iOS & Android</span>
        </div>
        <div class="web-url">
          <span style="color: #6C4B35; font-weight: 500;">Official Web App</span>
          <span style="color:#C5A059;">✦</span>
          <span>shoonaya.com</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
